services:
  mission-control:
    build: .
    container_name: mission-control
    ports:
      - "${MC_PORT:-3000}:${PORT:-3000}"
      # Hermes web dashboard (started manually: hermes dashboard --host 0.0.0.0)
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    environment:
      - PORT=${PORT:-3000}
      # Effective home for the app and agent runtimes (hermes/claude/codex
      # live under the data volume; detectors resolve paths via $HOME)
      - HOME=/app/.data
      - PATH=/app/.data/.local/bin:/app/.data/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # ── Server-side gateway connection (MC backend → gateway) ──
      # host.docker.internal resolves to the Docker host on Docker Desktop (macOS/Windows).
      # On Linux, the extra_hosts entry below makes this work.
      # If your gateway runs in another container, set this to the container name instead.
      - OPENCLAW_GATEWAY_HOST=${OPENCLAW_GATEWAY_HOST:-host.docker.internal}
      - OPENCLAW_GATEWAY_PORT=${OPENCLAW_GATEWAY_PORT:-18789}
      # ── Browser-side gateway connection (user's browser → gateway) ──
      # NEXT_PUBLIC_GATEWAY_HOST must be reachable from the user's browser, NOT from
      # inside the container. For local Docker: leave empty (auto-detected from browser).
      # For remote/VPS: set to the public hostname or IP where the gateway is reachable.
      #
      # IMPORTANT: NEXT_PUBLIC_* variables are baked into the browser bundle at BUILD TIME,
      # not runtime. Setting them here only works if you rebuild the image:
      #   NEXT_PUBLIC_GATEWAY_HOST=oc.example.com docker compose build
      # Alternative: use the Advanced Settings on the login page to set the gateway URL
      # at runtime — it persists in localStorage and overrides the baked-in value.
      # - NEXT_PUBLIC_GATEWAY_HOST=${NEXT_PUBLIC_GATEWAY_HOST:-}
      # - NEXT_PUBLIC_GATEWAY_PORT=${NEXT_PUBLIC_GATEWAY_PORT:-18789}
      # Set to true if running without an OpenClaw gateway (standalone dashboard mode).
      # - NEXT_PUBLIC_GATEWAY_OPTIONAL=true
      - IDE_PUBLIC_URL=${IDE_PUBLIC_URL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      # Data location — defaults to the named volume. Set MC_DATA_DIR in .env
      # (or the shell) to a host path to bind-mount instead, e.g.:
      #   MC_DATA_DIR=./data          (relative to this compose file)
      #   MC_DATA_DIR=D:/mc-data      (Windows: use forward slashes)
      - ${MC_DATA_DIR:-mc-data}:/app/.data
      # Optional: mount your OpenClaw state directory read-only so Mission Control
      # can read agent configs and memory. Uncomment and adjust the host path:
      # - ${OPENCLAW_HOME:-~/.openclaw}:/run/openclaw:ro
    # Allow the container to reach an OpenClaw gateway running on the Docker host.
    # Docker Desktop (macOS/Windows): host.docker.internal works out of the box.
    # Linux: this extra_hosts entry maps host.docker.internal to the host IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MC_MEMORY_LIMIT:-2G}
          cpus: '1.0'
          pids: 256
    networks:
      - mc-net
    restart: unless-stopped

  # Standalone mode — no gateway required. Start with:
  #   docker compose --profile standalone up
  mission-control-standalone:
    extends:
      service: mission-control
    container_name: mission-control-standalone
    profiles:
      - standalone
    environment:
      - PORT=${PORT:-3000}
      - NEXT_PUBLIC_GATEWAY_OPTIONAL=true

  mc-devshell:
    build: ./devshell
    container_name: mc-devshell
    depends_on:
      - mission-control
    # NOTE: mission-control's MC_ALLOWED_HOSTS must include the internal service name
    # 'mission-control' so the reconciler's http://mission-control:3000 calls aren't
    # rejected (403) by MC's production host allowlist (src/proxy.ts).
    environment:
      - MC_URL=${MC_INTERNAL_URL:-http://mission-control:3000}
      - MC_API_KEY=${MC_API_KEY:?set MC_API_KEY in .env for the devshell reconciler}
      - RECONCILE_INTERVAL=${RECONCILE_INTERVAL:-30}
      # Cookie-signing key for the IDE proxy. Leave empty and the entrypoint
      # generates one and persists it on the homes volume, so a plain
      # `docker compose up` works without pre-seeding secrets. Set it
      # explicitly to share one key across replicas.
      - IDE_PROXY_SECRET=${IDE_PROXY_SECRET:-}
      - IDE_IDLE_MINUTES=${IDE_IDLE_MINUTES:-30}
    ports:
      - "${DEVSHELL_SSH_PORT:-2222}:22"
      # Loopback-only by default — no TLS terminator in front of code-server's
      # session cookie otherwise. Set DEVSHELL_IDE_BIND to widen (e.g. 0.0.0.0).
      - "${DEVSHELL_IDE_BIND:-127.0.0.1}:${DEVSHELL_IDE_PORT:-8443}:8443"
    volumes:
      - mc-homes:/home
      # Shared code — same dir the developers and agents use.
      - ${MC_REPOS_DIR:-../repos}:/srv/repos
    networks:
      - mc-net
    restart: unless-stopped

volumes:
  mc-data:
  mc-homes:

networks:
  mc-net:
    driver: bridge
