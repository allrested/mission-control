# Dokploy / Traefik deployment file — SELF-CONTAINED.
#
# Deploy with this file ALONE (Dokploy points at one compose file):
#   docker compose -f docker-compose.dokploy.yml up -d
#
# It `extends` each service from docker-compose.yml, so image/build, ports,
# environment and volumes all come from there — one source of truth — and this
# file only adds what's Dokploy-specific: Traefik routing labels and the
# external dokploy-network. Local runs still use plain docker-compose.yml with
# no Traefik.
#
# NOTE: `extends` does NOT carry over depends_on, and top-level volumes/networks
# must be declared here too — both are restated below.
#
# Required in .env on the server:
#   MC_DOMAIN=ai.flavours.sa
#   HERMES_DOMAIN=chat.flavours.sa
#   IDE_DOMAIN=ide.flavours.sa
#   IDE_PUBLIC_URL=https://ide.flavours.sa      # what the "Open IDE" button links to
#   MC_ALLOWED_HOSTS=ai.flavours.sa,chat.flavours.sa,mission-control,localhost,127.0.0.1,::1
#   MC_API_KEY=<the key from .data/.generated-secrets>
#   MC_BIND=127.0.0.1                            # don't expose 3000/9119 on the public IP
#   MC_REPOS_DIR=/path/to/shared/repos           # host dir shared by all users
#   TRAEFIK_CERTRESOLVER=letsencrypt             # match your Dokploy resolver name
#
# Traefik reaches each container over dokploy-network, so no port needs to be
# published for routing; the base file's publishes stay loopback-bound.
#
# Cloudflare: A/CNAME for ai, chat, ide → the server; proxied is fine
# (WebSockets are on by default and code-server's terminal needs them).
# Use SSL/TLS mode "Full (strict)" since Traefik holds a real certificate.

services:
  mission-control:
    extends:
      file: docker-compose.yml
      service: mission-control
    networks:
      - mc-net
      - dokploy-network
    labels:
      # Two routers on one container: the app (3000) and the hermes dashboard
      # (9119), each needs its own named service.
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Mission Control
      - traefik.http.routers.mc.rule=Host(`${MC_DOMAIN:?set MC_DOMAIN}`)
      - traefik.http.routers.mc.entrypoints=websecure
      - traefik.http.routers.mc.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mc.service=mc
      - traefik.http.services.mc.loadbalancer.server.port=${PORT:-3000}
      # Hermes dashboard
      - traefik.http.routers.mchermes.rule=Host(`${HERMES_DOMAIN:?set HERMES_DOMAIN}`)
      - traefik.http.routers.mchermes.entrypoints=websecure
      - traefik.http.routers.mchermes.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mchermes.service=mchermes
      - traefik.http.services.mchermes.loadbalancer.server.port=9119

  mc-devshell:
    extends:
      file: docker-compose.yml
      service: mc-devshell
    # extends drops depends_on — restate it.
    depends_on:
      - mission-control
    networks:
      - mc-net
      - dokploy-network
    labels:
      # Browser IDE. Traefik proxies WebSockets natively, which code-server's
      # terminal requires. Its X-Forwarded-Proto: https is also what makes the
      # IDE session cookie Secure (see devshell/ide-proxy/server.js).
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.mcide.rule=Host(`${IDE_DOMAIN:?set IDE_DOMAIN}`)
      - traefik.http.routers.mcide.entrypoints=websecure
      - traefik.http.routers.mcide.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.mcide.service=mcide
      - traefik.http.services.mcide.loadbalancer.server.port=8443

volumes:
  mc-data:
  mc-homes:

networks:
  mc-net:
    driver: bridge
  dokploy-network:
    external: true
